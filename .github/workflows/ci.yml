name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The browser backends compile to nothing on the host, so the workspace
      # sweep above lints none of their code. Lint them where it exists.
      - run: cargo clippy -p pipecrab-audio-web -p pipecrab-vad-web -p pipecrab-stt-web -p pipecrab-lm-web -p pipecrab-tts-web -p web-vad-stt -p web-e2e --target wasm32-unknown-unknown --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # cpal's Linux (ALSA) backend needs the libasound headers to build.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      # Both excluded packages link sherpa's static libraries and llama.cpp into
      # one binary, and on x86-64 Linux that combination aborts under the test
      # harness with a C++ std::bad_alloc. Each library links fine alone.
      #
      # e2e-voice-agent links the same pair and is *not* excluded: it carries no
      # test functions, and the abort has only ever been seen in a binary that
      # has some. So adding a #[test] to e2e-voice-agent would likely need it
      # excluded here too — the exclusion tracks having tests, not the linkage
      # alone. The clippy job still builds all three.
      - run: cargo test --workspace --exclude lm-llamacpp --exclude e2e-voice-agent-hermes
      # Portability gate. The sans-IO core, the runtime-agnostic async layer, and
      # every platform-neutral trait crate must compile for the browser — no
      # host-only dependency may creep in. Concrete backends are exempt: they are
      # allowed to be host-specific (pipecrab-audio-cpal is native-only, so it is
      # not checked here). The browser backends are the mirror image — wasm-only,
      # so wasm is the only target that compiles anything of them at all — and
      # they are checked below.
      #
      # The sans-IO core is pure logic — no async, no I/O — so it must build everywhere.
      - run: cargo check -p pipecrab-core --target wasm32-unknown-unknown
      # The runtime must stay executor-agnostic and build for the browser.
      - run: cargo check -p pipecrab-runtime --target wasm32-unknown-unknown
      # The audio I/O trait crate is platform-neutral and must build for the browser too.
      - run: cargo check -p pipecrab-audio --target wasm32-unknown-unknown
      # The STT interface is only the Transcriber trait plus its adapter — no engine — so
      # it must build for the browser, where the engine is Transformers.js.
      - run: cargo check -p pipecrab-stt --target wasm32-unknown-unknown
      # The VAD interface is likewise engine-free — just the VoiceActivityDetector trait —
      # so it must build for the browser, where the engine is onnxruntime-web.
      - run: cargo check -p pipecrab-vad --target wasm32-unknown-unknown
      # The TTS interface is engine-free — the Synthesizer trait, its stage, and the
      # chunker — so it must build for the browser, where the engine runs in a Worker.
      - run: cargo check -p pipecrab-tts --target wasm32-unknown-unknown
      # Turn policy is pure pipeline logic — the BargeInStage and nothing else — so
      # it must build for the browser.
      - run: cargo check -p pipecrab-turn --target wasm32-unknown-unknown
      # The LM interface is engine-free — the LanguageModel trait plus the LmStage
      # adapter — so it must build for the browser, where the engine runs in a Worker.
      - run: cargo check -p pipecrab-lm --target wasm32-unknown-unknown
      # Dispatch is transport-neutral — the ingress/egress stages plus the
      # DispatchSource/DispatchSink traits, no concrete transport — so it must
      # build for the browser, where a transport is e.g. a WebSocket adapter.
      - run: cargo check -p pipecrab-dispatch --target wasm32-unknown-unknown
      # The browser backends. Everything above only proves no *host* dependency
      # crept in; these prove the browser path itself still builds, since wasm is
      # the one target where they are more than an empty crate.
      - run: cargo check -p pipecrab-audio-web --target wasm32-unknown-unknown
      - run: cargo check -p pipecrab-vad-web --target wasm32-unknown-unknown
      - run: cargo check -p pipecrab-stt-web --target wasm32-unknown-unknown
      - run: cargo check -p pipecrab-lm-web --target wasm32-unknown-unknown
      - run: cargo check -p pipecrab-tts-web --target wasm32-unknown-unknown
      # And the examples that wire them together, which is what would actually
      # notice a browser-side regression.
      - run: cargo check -p web-vad-stt --target wasm32-unknown-unknown
      - run: cargo check -p web-e2e --target wasm32-unknown-unknown
